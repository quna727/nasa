<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>토닥 - AI 마음 상담실</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;

  background: linear-gradient(135deg, #f7f3ff, #eef7ff);
  color: #333;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 30px 18px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.badge {
  display: inline-block;
  padding: 7px 13px;
  border-radius: 20px;
  background: #eee9ff;
  color: #7358e8;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
}

h1 {
  margin: 0 0 12px;
  font-size: 27px;
  line-height: 1.4;
}

.description {
  color: #777;
  line-height: 1.6;
  margin-bottom: 25px;
}

.notice {
  background: #fff;
  border: 1px solid #e8e1ff;
  border-radius: 16px;
  padding: 14px 16px;
  font-size: 13px;
  line-height: 1.6;
  color: #666;
  margin-bottom: 20px;
}

.type-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.type-card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  cursor: pointer;
  border: 1px solid #eee;
  transition: 0.2s;
  box-shadow: 0 5px 18px rgba(70, 50, 120, 0.06);
}

.type-card:hover {
  transform: translateY(-2px);
  border-color: #b9a8ff;
  box-shadow: 0 8px 25px rgba(70, 50, 120, 0.12);
}

.type-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 7px;
}

.type-sub {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
}

.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.chat-header h2 {
  margin: 0;
  font-size: 21px;
}

.reset-btn {
  border: none;
  background: #eee9ff;
  color: #6c51df;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.chat-box {
  height: 60vh;
  min-height: 430px;
  max-height: 600px;
  overflow-y: auto;
  background: rgba(255,255,255,0.8);
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 8px 25px rgba(70, 50, 120, 0.08);
}

.message {
  max-width: 82%;
  padding: 12px 15px;
  border-radius: 17px;
  margin-bottom: 12px;
  line-height: 1.6;
  font-size: 14px;
  white-space: pre-wrap;
}

.bot-msg {
  background: #f0ecff;
  margin-right: auto;
  border-bottom-left-radius: 5px;
}

.user-msg {
  background: #7b61ff;
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.loading-msg {
  opacity: 0.65;
}

.chat-input-group {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.chat-input {
  flex: 1;
  border: none;
  background: white;
  border-radius: 14px;
  padding: 14px;
  outline: none;
  font-size: 14px;
  box-shadow: 0 4px 15px rgba(70, 50, 120, 0.06);
}

.chat-send-btn {
  border: none;
  background: #7b61ff;
  color: white;
  padding: 0 18px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 700;
}

.chat-send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.small-info {
  text-align: center;
  color: #999;
  font-size: 11px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

  <!-- 유형 선택 -->
  <section id="select-screen" class="screen active">

    <span class="badge">🌷 토닥 AI 마음 상담실</span>

    <h1>어떤 마음을 돌보고 싶으신가요?</h1>

    <p class="description">
      지금 마음에 가까운 주제를 선택하면<br>
      토닥이가 이야기를 들어드릴게요.
    </p>

    <div class="notice">
      토닥이는 전문 의료기관이나 심리상담사를 대신하지 않습니다.
      진단을 내리기보다는 사용자의 이야기를 듣고 감정을 이해하는 데 도움을 줍니다.
    </div>

    <div class="type-list" id="type-list"></div>

  </section>


  <!-- 상담 화면 -->
  <section id="chat-screen" class="screen">

    <div class="chat-header">

      <h2 id="chat-type-name">상담실</h2>

      <button
        class="reset-btn"
        onclick="showSelectScreen()"
      >
        유형 변경
      </button>

    </div>

    <div
      id="chat-box"
      class="chat-box"
    ></div>

    <div class="chat-input-group">

      <input
        id="chat-input"
        class="chat-input"
        type="text"
        placeholder="어떤 일이 있었는지 이야기해 보세요..."
        maxlength="1000"
      >

      <button
        id="send-btn"
        class="chat-send-btn"
        onclick="sendMessage()"
      >
        전송
      </button>

    </div>

    <div class="small-info">
      AI의 답변은 참고용이며 전문적인 상담이나 진단을 대신하지 않습니다.
    </div>

  </section>

</div>


<script>

const types = {

  affection: {
    name: "애정과 관계",
    animal: "🦩",
    sub: "사랑과 관심, 관계 속에서 느끼는 외로움",
    welcome:
      "안녕하세요. 토닥이에요 🌷\n요즘 사랑이나 관심이 부족하다고 느끼거나 관계 때문에 마음이 힘들었나요? 편한 만큼 이야기해 주세요.",
    instruction:
      "사용자가 사랑, 관심, 관계에서 외로움이나 서운함을 느끼는 상황을 이야기하면 감정을 먼저 이해하고 공감하세요. 사용자의 감정을 섣불리 판단하거나 진단하지 마세요."
  },

  recognition: {
    name: "인정과 평가",
    animal: "🐒",
    sub: "성적, 성과, 타인의 시선과 인정에 대한 고민",
    welcome:
      "안녕하세요. 토닥이에요 🌷\n다른 사람의 평가나 인정 때문에 마음이 힘들었나요? 어떤 일이 있었는지 편하게 이야기해 주세요.",
    instruction:
      "사용자가 다른 사람의 평가, 성과, 인정 때문에 힘들어한다면 노력과 감정을 존중하며 대화하세요. 단순히 '신경 쓰지 마'라고 하지 말고 왜 평가가 중요하게 느껴지는지 함께 살펴보세요."
  },

  isolation: {
    name: "소외감과 고립",
    animal: "🦔",
    sub: "친구 관계, 집단에서 소외된 느낌",
    welcome:
      "어서 오세요. 토닥이에요 🌷\n친구들이나 주변 사람들과 어울리지 못하고 혼자 남겨진 것 같은 느낌이 들었나요? 천천히 이야기해 주세요.",
    instruction:
      "사용자가 소외감이나 외로움을 이야기하면 그 상황을 구체적으로 이해하려고 노력하세요. '네가 이상해서 그런 거야' 같은 표현을 사용하지 마세요."
  },

  selfesteem: {
    name: "자존감과 자기이해",
    animal: "🌰",
    sub: "자신에 대한 부정적인 생각과 자신감 부족",
    welcome:
      "안녕하세요. 토닥이에요 🌷\n요즘 스스로가 부족하다고 느끼거나 자신에 대한 생각 때문에 힘들었나요? 이야기해 주세요.",
    instruction:
      "사용자가 자신을 부정적으로 바라보고 있다면 그 감정을 존중하고 구체적인 상황을 함께 살펴보세요. 사용자를 비난하거나 외모나 능력을 다른 사람과 비교하지 마세요."
  },

  dependency: {
    name: "독립과 의존",
    animal: "🐥",
    sub: "혼자 결정하기 어렵거나 도움을 요청하고 싶은 마음",
    welcome:
      "반가워요. 토닥이에요 🌷\n혼자 결정하거나 행동해야 하는 상황이 부담스럽게 느껴졌나요? 어떤 상황인지 함께 이야기해 봐요.",
    instruction:
      "사용자가 혼자 결정하거나 행동하는 것을 어려워한다면 상황을 이해하고 스스로 선택할 수 있는 작은 방법을 함께 찾아보세요. AI에게 의존하도록 유도하지 마세요."
  },

  selfobject: {
    name: "공허함과 이해받고 싶은 마음",
    animal: "🐧",
    sub: "마음을 알아주는 사람이 없다고 느끼는 상황",
    welcome:
      "어서 오세요. 토닥이에요 🌷\n마음을 알아주는 사람이 없거나 마음 한쪽이 허전하게 느껴졌나요? 무슨 일이 있었는지 들려주세요.",
    instruction:
      "사용자가 공허함이나 이해받지 못한다는 느낌을 이야기하면 감정을 구체적으로 이해하려고 노력하세요. AI가 사용자의 유일한 친구나 의지할 대상인 것처럼 말하지 마세요."
  },

  trust: {
    name: "신뢰와 관계",
    animal: "🌵",
    sub: "친구 관계의 상처, 배신, 사람을 믿기 어려운 마음",
    welcome:
      "안녕하세요. 토닥이에요 🌷\n누군가에게 상처받거나 사람을 믿기 어려워진 경험이 있나요? 괜찮은 만큼 이야기해 주세요.",
    instruction:
      "사용자가 다른 사람에게 상처받거나 신뢰하기 어려운 상황을 이야기하면 경계심을 존중하세요. '다시 믿어야 해'라고 강요하지 말고 안전하다고 느끼는 범위에서 천천히 관계를 생각하도록 도와주세요."
  }

};


let selectedTypeKey = null;

let chatHistory = [];

let sending = false;


/* 유형 목록 만들기 */

function initTypeSelect() {

  const list = document.getElementById("type-list");

  list.innerHTML = "";

  Object.entries(types).forEach(([key, type]) => {

    const card = document.createElement("div");

    card.className = "type-card";

    card.innerHTML = `
      <div class="type-title">
        ${type.animal} ${type.name}
      </div>

      <div class="type-sub">
        ${type.sub}
      </div>
    `;

    card.onclick = () => startChat(key);

    list.appendChild(card);

  });

}


/* 상담 시작 */

function startChat(key) {

  selectedTypeKey = key;

  chatHistory = [];

  const type = types[key];

  document
    .getElementById("select-screen")
    .classList.remove("active");

  document
    .getElementById("chat-screen")
    .classList.add("active");

  document
    .getElementById("chat-type-name")
    .textContent = `${type.animal} ${type.name}`;

  const chatBox = document.getElementById("chat-box");

  chatBox.innerHTML = "";

  addMessage(type.welcome, "bot");

  document.getElementById("chat-input").focus();

}


/* 유형 선택 화면 */

function showSelectScreen() {

  document
    .getElementById("chat-screen")
    .classList.remove("active");

  document
    .getElementById("select-screen")
    .classList.add("active");

  selectedTypeKey = null;

}


/* 메시지 표시 */

function addMessage(text, sender, loading = false) {

  const chatBox = document.getElementById("chat-box");

  const div = document.createElement("div");

  div.className =
    sender === "user"
      ? "message user-msg"
      : "message bot-msg";

  if (loading) {
    div.classList.add("loading-msg");
  }

  div.textContent = text;

  chatBox.appendChild(div);

  chatBox.scrollTop = chatBox.scrollHeight;

  return div;

}


/* 메시지 전송 */

async function sendMessage() {

  if (sending) return;

  const input = document.getElementById("chat-input");

  const text = input.value.trim();

  if (!text || !selectedTypeKey) return;

  sending = true;

  input.value = "";

  const sendButton =
    document.getElementById("send-btn");

  sendButton.disabled = true;

  addMessage(text, "user");

  const loading =
    addMessage(
      "토닥이가 마음을 생각하며 답변을 작성하고 있어요...",
      "bot",
      true
    );


  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        type: selectedTypeKey,

        messages: chatHistory.concat([
          {
            role: "user",
            content: text
          }
        ])

      })

    });


    const data = await response.json();

    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error || "AI 응답을 가져오지 못했습니다."
      );

    }


    const reply = data.reply;

    addMessage(reply, "bot");


    chatHistory.push(
      {
        role: "user",
        content: text
      },
      {
        role: "assistant",
        content: reply
      }
    );


    /*
      너무 긴 대화가 API로 계속 전송되지 않도록
      최근 대화만 유지
    */

    if (chatHistory.length > 20) {

      chatHistory =
        chatHistory.slice(-20);

    }


  } catch (error) {

    loading.remove();

    addMessage(
      "앗, 잠시 문제가 생겼어요. 잠시 후 다시 시도해 주세요.",
      "bot"
    );

    console.error(error);

  } finally {

    sending = false;

    sendButton.disabled = false;

    input.focus();

  }

}


/* Enter 키 */

document
  .getElementById("chat-input")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  });


initTypeSelect();

</script>

</body>
</html>
