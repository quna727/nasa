<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>토닥 - AI 마음 상담실</title>

  <style>
    :root {
      --primary-color: #7b61ff;
      --secondary-color: #f3f0ff;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --sub-text: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont,
        system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      color: var(--sub-text);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: var(--secondary-color);
      color: var(--primary-color);
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .type-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .type-card {
      padding: 12px;
      border: 1.5px solid #e9ecef;
      border-radius: 10px;
      background: #fff;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .type-card:hover {
      border-color: var(--primary-color);
      background-color: var(--secondary-color);
    }

    .type-card .title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #222;
    }

    .type-card .sub {
      font-size: 0.8rem;
      color: #666;
      margin-top: 2px;
    }

    .chat-header {
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2 {
      font-size: 1rem;
      color: var(--primary-color);
      text-align: left;
    }

    .reset-btn {
      padding: 5px 10px;
      font-size: 0.75rem;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .chat-box {
      height: 380px;
      overflow-y: auto;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 12px;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.5;
      word-break: keep-all;
      text-align: left;
    }

    .bot-msg {
      align-self: flex-start;
      background-color: #ffffff;
      border: 1px solid #e2e2e2;
      color: #333;
      border-top-left-radius: 2px;
    }

    .user-msg {
      align-self: flex-end;
      background-color: var(--primary-color);
      color: white;
      border-top-right-radius: 2px;
    }

    .chat-input-group {
      display: flex;
      gap: 6px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #e9ecef;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .chat-send-btn {
      padding: 0 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .chat-send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading-msg {
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 상담 유형 선택 -->
    <div class="screen active" id="select-screen">

      <span class="badge">토닥 AI 마음 상담실</span>

      <h1>어떤 마음을 돌보고 싶으신가요?</h1>

      <p>
        고민되는 마음의 유형을 선택하면<br>
        토닥이와 대화를 시작할 수 있어요.
      </p>

      <div class="type-list" id="type-list"></div>

    </div>


    <!-- AI 상담실 -->
    <div class="screen" id="chat-screen">

      <div class="chat-header">

        <h2 id="chat-type-name">상담실</h2>

        <button
          class="reset-btn"
          onclick="showSelectScreen()"
        >
          유형 변경
        </button>

      </div>

      <div
        class="chat-box"
        id="chat-box"
      ></div>

      <div class="chat-input-group">

        <input
          type="text"
          id="chat-input"
          class="chat-input"
          placeholder="어떤 일이 있으셨는지 자유롭게 이야기해 보세요..."
          onkeypress="handleKeyPress(event)"
        />

        <button
          id="send-button"
          class="chat-send-btn"
          onclick="sendMessage()"
        >
          전송
        </button>

      </div>

    </div>

  </div>


  <script>

    // 상담 유형
    const types = {

      affection: {
        name: "애정 및 관계",
        animal: "🦩",
        sub: "사랑과 관심, 관계에서 느끼는 외로움",
        welcome:
          "안녕하세요. 요즘 사랑이나 관심이 필요하다고 느끼셨나요? 어떤 일이 있었는지 편하게 이야기해 주세요."
      },

      recognition: {
        name: "인정과 평가",
        animal: "🐒",
        sub: "성적, 성과, 다른 사람의 평가 때문에 느끼는 부담",
        welcome:
          "안녕하세요. 다른 사람의 평가나 인정 때문에 마음이 힘들었던 일이 있나요? 편하게 이야기해 주세요."
      },

      isolation: {
        name: "소외감과 고립",
        animal: "🦔",
        sub: "친구 관계나 집단에서 혼자라고 느끼는 마음",
        welcome:
          "안녕하세요. 요즘 주변 사람들과 함께 있어도 혼자인 것처럼 느껴졌나요? 어떤 상황이 있었는지 이야기해 주세요."
      },

      selfesteem: {
        name: "자신에 대한 생각",
        animal: "🌰",
        sub: "자신을 부족하게 느끼거나 스스로를 부정적으로 바라보는 마음",
        welcome:
          "안녕하세요. 요즘 자신에 대해 부정적으로 생각하게 되는 일이 있었나요? 천천히 이야기해 주세요."
      },

      dependency: {
        name: "결정과 주체성",
        animal: "🐥",
        sub: "혼자 결정하거나 행동하는 것이 부담스러운 마음",
        welcome:
          "안녕하세요. 혼자 결정하거나 행동하는 것이 어렵게 느껴지는 일이 있었나요? 함께 이야기해 봐요."
      },

      selfobject: {
        name: "공허함과 이해받고 싶은 마음",
        animal: "🐧",
        sub: "마음을 알아주는 사람이 없다고 느끼는 마음",
        welcome:
          "안녕하세요. 요즘 마음이 텅 빈 것처럼 느껴지거나 나를 이해해주는 사람이 없다고 느낀 적이 있나요?"
      },

      trust: {
        name: "신뢰와 관계",
        animal: "🌵",
        sub: "상처받은 뒤 다른 사람을 믿기 어려운 마음",
        welcome:
          "안녕하세요. 다른 사람을 믿기 어려워진 일이 있었나요? 부담되지 않는 만큼만 이야기해 주세요."
      }

    };


    let selectedTypeKey = "affection";

    let chatHistory = [];


    // 상담 유형 목록 만들기
    function initTypeSelect() {

      const container =
        document.getElementById("type-list");

      container.innerHTML = "";

      for (const key in types) {

        const item = types[key];

        const card =
          document.createElement("div");

        card.className = "type-card";

        card.innerHTML = `
          <div class="title">
            ${item.name} ${item.animal}
          </div>

          <div class="sub">
            ${item.sub}
          </div>
        `;

        card.onclick = () => startChat(key);

        container.appendChild(card);
      }
    }


    // 유형 선택 화면
    function showSelectScreen() {

      document
        .getElementById("chat-screen")
        .classList.remove("active");

      document
        .getElementById("select-screen")
        .classList.add("active");
    }


    // 상담 시작
    function startChat(key) {

      selectedTypeKey = key;

      chatHistory = [];

      const item = types[key];

      document
        .getElementById("select-screen")
        .classList.remove("active");

      document
        .getElementById("chat-screen")
        .classList.add("active");

      document
        .getElementById("chat-type-name")
        .innerText =
          `${item.name} 상담실`;

      const chatBox =
        document.getElementById("chat-box");

      chatBox.innerHTML = "";

      addMessage(item.welcome, "bot");
    }


    // 메시지 표시
    function addMessage(
      text,
      sender,
      isLoading = false
    ) {

      const chatBox =
        document.getElementById("chat-box");

      const msgDiv =
        document.createElement("div");

      msgDiv.className =
        `message ${
          sender === "user"
            ? "user-msg"
            : "bot-msg"
        }`;

      if (isLoading) {
        msgDiv.classList.add("loading-msg");
      }

      msgDiv.innerText = text;

      chatBox.appendChild(msgDiv);

      chatBox.scrollTop =
        chatBox.scrollHeight;

      return msgDiv;
    }


    // 메시지 전송
    async function sendMessage() {

      const input =
        document.getElementById("chat-input");

      const sendButton =
        document.getElementById("send-button");

      const text =
        input.value.trim();

      if (!text) return;


      // 사용자 메시지 표시
      addMessage(text, "user");

      input.value = "";

      sendButton.disabled = true;


      // 로딩 메시지
      const loadingDiv =
        addMessage(
          "토닥이 답변을 생각하고 있어요...",
          "bot",
          true
        );


      try {

        // 최근 대화 저장
        chatHistory.push({
          role: "user",
          content: text
        });


        // Vercel 서버에 요청
        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              type: selectedTypeKey,

              messages: chatHistory

            })

          });


        const data =
          await response.json();


        loadingDiv.remove();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "서버에서 오류가 발생했습니다."
          );

        }


        const reply = data.reply;


        // AI 답변 저장
        chatHistory.push({

          role: "assistant",

          content: reply

        });


        addMessage(
          reply,
          "bot"
        );


      } catch (error) {

        console.error(error);

        loadingDiv.remove();

        addMessage(
          "앗, 잠시 문제가 생겼어요. 잠시 후 다시 시도해 주세요.",
          "bot"
        );

      } finally {

        sendButton.disabled = false;

        input.focus();

      }

    }


    // Enter 키로 전송
    function handleKeyPress(event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }


    // 시작
    initTypeSelect();

  </script>

</body>
</html>
