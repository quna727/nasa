<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>토닥 - 캐릭터 마음 대화실</title>
<style>
:root{--primary:#7b61ff;--soft:#f3f0ff;--bg:#f8f9fc;--text:#2c2939;--muted:#77738a;--accent:#7b61ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:850px;margin:30px auto;padding:0 16px}.panel{background:white;border-radius:24px;box-shadow:0 12px 35px #352c6410;overflow:hidden}.top{padding:28px 28px 12px;text-align:center}.pill{display:inline-block;background:var(--soft);color:var(--primary);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700}.top h1{margin:14px 0 8px;font-size:26px}.top p,.note{font-size:13px;color:var(--muted);line-height:1.6}.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px 24px 30px}.type{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid #eeebf5;border-radius:18px;padding:13px;cursor:pointer;transition:.18s}.type:hover,.type:focus-visible{border-color:#a18bff;background:#fbfaff;transform:translateY(-2px)}.type img{width:88px;height:88px;object-fit:contain;background:#faf8ff;border-radius:16px}.type strong{display:block;font-size:17px}.type small{display:block;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.type em{font-style:normal;color:var(--primary);font-size:11px;display:block;margin-bottom:3px}.chat{display:none}.chat.active{display:block}.select.hidden{display:none}.chat-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #f0eef4;background:#fff}.chat-head img{width:58px;height:58px;object-fit:contain;background:#f8f5ff;border-radius:14px}.chat-head strong{display:block;font-size:19px}.chat-head small{color:var(--muted);font-size:12px}.back{margin-left:auto;border:1px solid #e4dff2;background:white;padding:9px 12px;border-radius:10px;cursor:pointer;color:#625c77}.messages{height:min(61vh,510px);min-height:340px;overflow-y:auto;padding:22px 18px;background:linear-gradient(180deg,#faf8ff,#f8f9fc)}.message-row{display:flex;align-items:flex-start;gap:9px;margin:0 0 17px}.message-row.user{justify-content:flex-end}.avatar{width:42px;height:42px;object-fit:contain;border-radius:12px;background:#fff;flex-shrink:0}.bubble-wrap{max-width:78%}.speaker{font-size:12px;font-weight:700;margin:0 0 5px;color:#625c77}.bubble{padding:12px 15px;background:white;border:1px solid #eeeaf4;border-radius:5px 16px 16px 16px;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--accent);color:white;border:0;border-radius:16px 5px 16px 16px}.input-row{display:flex;gap:9px;padding:15px;border-top:1px solid #f0eef4}.input-row input{flex:1;min-width:0;border:1.5px solid #e8e3f2;border-radius:12px;padding:13px;font-size:14px;outline:none}.input-row input:focus{border-color:var(--accent)}.send{background:var(--accent);color:white;border:0;border-radius:12px;padding:0 22px;font-weight:700;cursor:pointer}.send:disabled{opacity:.55;cursor:wait}.foot{padding:0 17px 15px;text-align:center;font-size:11px;color:var(--muted)}@media(max-width:560px){.wrap{margin:0;padding:0}.panel{min-height:100vh;border-radius:0}.types{grid-template-columns:1fr;padding:12px 16px 24px}.top{padding:24px 15px 10px}.top h1{font-size:22px}.type img{width:75px;height:75px}.messages{height:calc(100dvh - 204px);min-height:290px}.chat-head{padding:11px}.bubble-wrap{max-width:80%}.send{padding:0 15px}}
</style>
</head>
<body><main class="wrap"><div class="panel">
<section class="select" id="select"><header class="top"><span class="pill">토닥 · AI 마음 대화실</span><h1>오늘은 누구와 이야기할까요?</h1><p>지금 마음에 가까운 주제를 골라 보세요.<br>일곱 친구가 여러분의 이야기를 기다리고 있어요.</p></header><div class="types" id="types"></div><p class="foot">토닥은 전문 상담이나 진단을 대신하지 않아요. 이름이나 연락처 같은 개인정보는 입력하지 마세요.</p></section>
<section class="chat" id="chat"><header class="chat-head"><img id="header-img" alt=""><div><strong id="header-name"></strong><small id="header-topic"></small></div><button class="back" id="back" type="button">← 친구 바꾸기</button></header><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="input-row" id="chat-form"><input id="chat-input" autocomplete="off" maxlength="1500" placeholder="마음속 이야기를 편하게 적어 주세요" aria-label="메시지 입력"><button class="send" id="send" type="submit">전송</button></form><p class="foot">AI와 나누는 대화예요. 위급하거나 많이 힘들 때는 믿을 만한 어른이나 전문가에게 도움을 요청하세요.</p></section>
</div></main>
<script>
// 이미지 파일은 chatbot.html과 같은 위치의 images 폴더에 넣으세요.
const characters = [
  {
    key: 'affection',
    name: '꼬꼬',
    topic: '애정',
    image: 'kokko.png',
    color: '#e985b1',
    desc: '사랑과 관심이 필요하다고 느껴질 때',
    welcome: '안녕! 나는 꼬꼬야. 요즘 누군가의 관심이나 다정한 말이 그리웠니? 어떤 마음인지 들려줄래?'
  },
  {
    key: 'recognition',
    name: '끼끼',
    topic: '인정',
    image: 'kikki.png',
    color: '#c8833c',
    desc: '인정받고 싶은 마음이 커질 때',
    welcome: '안녕! 나는 끼끼야. 다른 사람의 평가 때문에 마음이 복잡했니? 무슨 일이 있었는지 이야기해 줘.'
  },
  {
    key: 'isolation',
    name: '또치',
    topic: '소외감',
    image: 'ttochi.png',
    color: '#8074bc',
    desc: '어딘가에 혼자 남겨진 것 같을 때',
    welcome: '안녕, 나는 또치야. 요즘 친구들 사이에서 혼자인 것처럼 느껴진 적 있어? 천천히 이야기해도 괜찮아.'
  },
  {
    key: 'selfesteem',
    name: '밤또리',
    topic: '생각',
    image: 'bamtori.png',
    color: '#9b552b',
    desc: '나 자신에 대한 생각이 복잡할 때',
    welcome: '안녕! 나는 밤또리야. 요즘 어떤 생각이 가장 마음에 걸려? 같이 차근차근 살펴보자.'
  },
  {
    key: 'dependency',
    name: '삐약',
    topic: '결정',
    image: 'ppiyak.png',
    color: '#dc9b20',
    desc: '선택하고 결정하기가 어려울 때',
    welcome: '삐약! 나는 삐약이야. 어떤 선택을 앞두고 고민 중이니? 네 마음이 원하는 걸 같이 찾아보자.'
  },
  {
    key: 'selfobject',
    name: '펭펭',
    topic: '공허함',
    image: 'pengpeng.png',
    color: '#26a6b4',
    desc: '마음 한구석이 허전하게 느껴질 때',
    welcome: '안녕, 나는 펭펭이야. 이유 없이 허전하거나 마음을 알아주는 사람이 없다고 느껴질 때가 있지? 지금 기분은 어때?'
  },
  {
    key: 'trust',
    name: '까까',
    topic: '신뢰',
    image: 'kkakka.png',
    color: '#64a645',
    desc: '누군가를 믿는 일이 어려울 때',
    welcome: '안녕! 나는 까까야. 누군가를 믿기 어려워진 일이 있었니? 말하고 싶은 만큼만 들려줘.'
  }
];
let current=null,history=[],busy=false;
const $=id=>document.getElementById(id);
for(const c of characters){const b=document.createElement('button');b.type='button';b.className='type';const im=document.createElement('img');im.src=c.image;im.alt=c.name+' 캐릭터';const txt=document.createElement('span');const em=document.createElement('em');em.textContent=c.topic;const strong=document.createElement('strong');strong.textContent=c.name;const small=document.createElement('small');small.textContent=c.desc;txt.append(em,strong,small);b.append(im,txt);b.onclick=()=>openChat(c);$('types').append(b)}
function openChat(c){current=c;history=[];document.documentElement.style.setProperty('--accent',c.color);$('select').classList.add('hidden');$('chat').classList.add('active');$('header-img').src=c.image;$('header-img').alt=c.name;$('header-name').textContent=c.name+'와 이야기하기';$('header-topic').textContent=c.topic+'에 관한 마음 이야기';$('messages').replaceChildren();addMessage(c.welcome,'bot');$('chat-input').focus()}
$('back').onclick=()=>{if(busy)return;$('chat').classList.remove('active');$('select').classList.remove('hidden');current=null;history=[]};
function addMessage(text,who){const row=document.createElement('div');row.className='message-row '+(who==='user'?'user':'bot');const wrap=document.createElement('div');wrap.className='bubble-wrap';if(who!=='user'){const avatar=document.createElement('img');avatar.className='avatar';avatar.src=current.image;avatar.alt='';row.append(avatar);const name=document.createElement('div');name.className='speaker';name.textContent=current.name;wrap.append(name)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;wrap.append(bubble);row.append(wrap);$('messages').append(row);$('messages').scrollTop=$('messages').scrollHeight;return row}
$('chat-form').onsubmit=async e=>{e.preventDefault();if(busy||!current)return;const input=$('chat-input');const text=input.value.trim();if(!text)return;input.value='';addMessage(text,'user');const next=[...history,{role:'user',content:text}];const loading=addMessage(current.name+'가 답변을 생각하고 있어요…','bot');busy=true;$('send').disabled=true;try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:current.key,messages:next})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.reply)throw new Error(data.error||'서버 응답 오류');loading.remove();addMessage(data.reply,'bot');history=[...next,{role:'assistant',content:data.reply}].slice(-20)}catch(error){console.error(error);loading.remove();addMessage('지금은 답변을 가져오지 못했어. 잠시 후 다시 시도해 줄래?','bot')}finally{busy=false;$('send').disabled=false;input.focus()}};
</script></body></html>
